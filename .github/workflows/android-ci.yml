name: Android CI/CD

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test-android:
    name: Build, Test & Package Android APK (Samsung Galaxy A37)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Sources/OpenKey/android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run Pure JVM Core & Android App Unit Tests
        run: ./gradlew :openkey-core:test :app:testDebugUnitTest

      - name: Assemble Samsung Galaxy A37 Debug APK
        run: |
          ./gradlew :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OpenKey-Android-A37.apk

      - name: Upload APK Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenKey-Android-A37
          path: Sources/OpenKey/android/app/build/outputs/apk/debug/OpenKey-Android-A37.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('OpenKey {0}', github.ref_name) || 'OpenKey Android (Samsung Galaxy A37) — Latest APK' }}
          prerelease: false
          make_latest: true
          files: Sources/OpenKey/android/app/build/outputs/apk/debug/OpenKey-Android-A37.apk
