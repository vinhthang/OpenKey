name: macOS CI/CD

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build, Test & Package (macOS 26 — Universal Test + arm64 App)
    runs-on: macos-26-intel
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Swift & Xcode toolchain
        run: |
          uname -m
          sw_vers
          swift --version
          xcodebuild -version

      - name: Run Shared Lexicon Parity Check
        run: python3 scripts/sync_shared_lexicon.py --check

      - name: Run Swift 6 unit and load tests
        run: swift test --package-path Sources/OpenKey/macOS-Swift

      - name: Build and ad-hoc sign OpenKeySwift.app
        run: |
          bash Sources/OpenKey/macOS-Swift/build-app.sh
          lipo -archs Sources/OpenKey/macOS-Swift/build/OpenKeySwift.app/Contents/MacOS/OpenKeySwift | grep -qx "arm64"
          codesign --verify --deep --strict Sources/OpenKey/macOS-Swift/build/OpenKeySwift.app

      - name: Package OpenKeySwift.zip and OpenKeySwift.dmg
        run: |
          cd Sources/OpenKey/macOS-Swift/build
          ditto -c -k --sequesterRsrc --keepParent OpenKeySwift.app OpenKeySwift-macOS-arm64.zip
          mkdir -p dmg-root
          cp -R OpenKeySwift.app dmg-root/
          ln -s /Applications dmg-root/Applications
          hdiutil create -volname "OpenKeySwift" -srcfolder dmg-root -ov -format UDZO OpenKeySwift.dmg
          rm -rf dmg-root

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenKeySwift-macOS-arm64
          path: |
            Sources/OpenKey/macOS-Swift/build/OpenKeySwift-macOS-arm64.zip
            Sources/OpenKey/macOS-Swift/build/OpenKeySwift.dmg

      - name: Clean stale non-macOS assets on rolling latest release
        if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if gh release view latest --repo "$REPO" >/dev/null 2>&1; then
            STALE_ASSETS="$(gh release view latest --repo "$REPO" --json assets --jq '.assets[].name | select(startswith("OpenKeySwift") | not)')"
            if [[ -n "$STALE_ASSETS" ]]; then
              while IFS= read -r asset; do
                [[ -n "$asset" ]] && gh release delete-asset latest "$asset" --repo "$REPO" --yes
              done <<< "$STALE_ASSETS"
            fi
            gh release edit latest \
              --repo "$REPO" \
              --target "$TARGET_SHA" \
              --title "OpenKey macOS (Apple Silicon) — Latest DMG" \
              --notes "Automated Apple Silicon (arm64) OpenKeySwift.dmg and ZIP build from master ($TARGET_SHA)."
          fi

      - name: Publish DMG and ZIP to GitHub Releases
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          target_commitish: ${{ github.sha }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('OpenKey macOS {0}', github.ref_name) || 'OpenKey macOS (Apple Silicon) — Latest DMG' }}
          generate_release_notes: ${{ startsWith(github.ref, 'refs/tags/v') }}
          prerelease: false
          make_latest: true
          files: |
            Sources/OpenKey/macOS-Swift/build/OpenKeySwift.dmg
            Sources/OpenKey/macOS-Swift/build/OpenKeySwift-macOS-arm64.zip
